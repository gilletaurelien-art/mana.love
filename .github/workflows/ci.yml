name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Frontière d'origines (liste blanche)
        run: node scripts/check-origins.mjs src
      - name: Lint
        run: npx eslint .
      - name: Typecheck
        run: npx tsc -b
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npx vite build
